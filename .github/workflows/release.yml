name: Release & Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    name: Build Android Host APK & Publish to Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install OpenSpec CLI & Validate Specs
        run: |
          npm install -g @fission-ai/openspec@latest
          openspec doctor
          openspec validate --specs --no-interactive

      - name: Set up Python 3.12 (uv)
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Run Backend Tests & Coverage Gate
        run: |
          uv sync
          uv run ruff check server
          uv run ruff format --check server
          uv run ty check server
          uv run pytest

      - name: Build Web Client SPA
        run: |
          cd client
          npm ci
          npm test
          npm run build

      - name: Sync Web Client to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/client_dist
          cp -r client/dist/* android/app/src/main/assets/client_dist/

      - name: Sync Python Server to Android Python Sources
        run: |
          mkdir -p android/app/src/main/python/server
          cp -r server/* android/app/src/main/python/server/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      # The keystore is written outside the repository working tree so it can never
      # be picked up by a later glob or archived into an artifact. Passwords travel
      # only through the process environment of the Gradle step. See REQ-AND-009.
      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the release APK would be unsigned and uninstallable."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/signing/release.jks") bytes)"

      - name: Build Signed Release APK with Gradle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --stacktrace

      # The v1.5.3 asset shipped as a debuggable, debug-key-signed APK and nothing
      # caught it, because the pipeline only ever checked that a file existed. This
      # step asserts on what the artifact actually is. See REQ-AND-006.
      - name: Verify APK Signature & Debuggable Flag
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Release APK not found at $APK"; exit 1; }

          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the AGP debug certificate; refusing to publish."
            exit 1
          fi
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" "v3 scheme (APK Signature Scheme v3): true"; do
            echo "$CERTS" | grep -qF "$scheme" || { echo "::error::Missing signature scheme -- expected '$scheme'"; exit 1; }
          done

          # aapt is still shipped through build-tools 34 but is deprecated; fall
          # back to aapt2 so a future build-tools bump does not break this gate.
          if [ -x "$BUILD_TOOLS/aapt" ]; then
            BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK")
          else
            BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          fi
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable; refusing to publish."
            exit 1
          fi
          echo "$BADGING" | grep -E "^package:"
          if echo "$BADGING" | grep -qE "^package: name='[^']*\.debug'"; then
            echo "::error::APK carries a .debug application id; refusing to publish."
            exit 1
          fi
          echo "APK verification passed."

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="latest"
          fi
          # Branch refs from workflow_dispatch dry-runs contain slashes
          # (e.g. hotfix/1.5.4-apk-release-signing); flatten them so the destination
          # stays a single file inside release_output/ instead of a subpath.
          VERSION_TAG="${VERSION_TAG//\//-}"
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="release_output/snake-royale-server-${VERSION_TAG}.apk"
          if [ -f "$APK_SOURCE" ]; then
            cp "$APK_SOURCE" "$APK_DEST"
          else
            echo "Searching for generated APK..."
            find android/app/build/outputs/ -name "*.apk" -exec cp {} release_output/snake-royale-server.apk \;
          fi
          # "App not installed" reads the same for a rejected package and a truncated
          # download; a published checksum separates the two in one command.
          cd release_output
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256

      - name: Upload APK to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            release_output/*.apk
            release_output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
