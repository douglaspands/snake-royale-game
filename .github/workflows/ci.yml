name: CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openspec-gate:
    name: OpenSpec Validation Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Run OpenSpec doctor & specification validation
        run: |
          openspec doctor
          openspec validate --specs --no-interactive

  backend-test:
    name: Backend Tests (pytest & linters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run ruff linter check
        run: uv run ruff check server

      - name: Run ruff formatter check
        run: uv run ruff format --check server

      - name: Run ty type checker
        run: uv run ty check server

      - name: Run pytest test suite with coverage gate (>= 80%)
        run: uv run pytest

  frontend-test:
    name: Frontend Tests (vitest & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: cd client && npm ci

      - name: Run vitest with coverage gate (>= 80%)
        run: cd client && npm test

      - name: Build frontend distribution
        run: cd client && npm run build
