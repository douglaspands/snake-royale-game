schema: "spec-driven"
project:
  name: "snake-battle-royale"
  version: "1.4.0-HUD-LAYOUT"
  description: "Real-time Multiplayer Snake Battle Royale Game (SDD + Graph Engineering)"

context: |
  Real-time Multiplayer Snake Battle Royale Game (SDD + Graph Engineering).
  Backend: Python 3.12+, uv, FastAPI, Uvicorn, WebSockets, pytest, 30-40 Hz Server-Authoritative.
  Frontend: Vite, TypeScript, Canvas 2D (60-120 FPS), LERP, vitest.
  Unified server: Single command distribution via uvicorn.

rules:
  proposals:
    - "Must specify clear problem statement, user stories, and measurable success criteria."
    - "Must detail backward-compatibility and zero-sleep test harness constraints."
  specs:
    - "Must use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY) or EARS formatting."
    - "Must provide explicit JSON Schemas for all network packets."
    - "Must include GIVEN / WHEN / THEN behavioral scenarios for each requirement."
  tasks:
    - "Tasks must follow the Graph Engineering DAG topology (Nodes 0, B1-B3, F1-F3, INT, DOC)."
    - "No production code implementation before specification validation."
